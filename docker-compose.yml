# Desenvolvimento local: apenas o PostgreSQL.
# API e web rodam fora do Docker (npm run start:dev / npm run dev); ver README.
#
#   cp .env.example .env      # defina POSTGRES_PASSWORD (nunca versione o .env)
#   docker compose up -d
#
# Produção: docker-compose.prod.yml (banco sem porta exposta, migrations sem seed).

services:
  postgres:
    image: postgres:16-alpine
    container_name: inovasix_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env (veja .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-inovasix_pedidos}
    # Só nesta máquina: o banco de desenvolvimento não fica acessível pela rede
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
