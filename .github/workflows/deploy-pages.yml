name: Deploy — GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissões necessárias para o GitHub Pages
permissions:
  contents: read
  pages:    write
  id-token: write

# Impede deploys concorrentes; cancela o anterior se novo push chegar
concurrency:
  group:               pages
  cancel-in-progress:  true

jobs:
  build:
    name: Build static export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache:        'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build (demo mode + static export)
        working-directory: web
        env:
          NEXT_PUBLIC_DEMO_MODE:    'true'
          NEXT_PUBLIC_API_URL:      ''
          NODE_TLS_REJECT_UNAUTHORIZED: '0'   # necessário para download de binários Prisma em alguns runners
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url:  ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id:   deployment
        uses: actions/deploy-pages@v4
